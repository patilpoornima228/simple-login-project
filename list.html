<!DOCTYPE html>
<html>
<head>
    
    <title>HTML Lists</title>
</head>
<body>
    <h2>Student Information</h2>

    <!-- Ordered list -->
     <h3>Subjects</h3>
    <ol>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ol>
    <!-- Unordered list -->
    <h3>Required Items</h3>
    <ul>
        <li>Laptop</li>
        <li>Notebooks</li>
        <li>Pen</li>
    </ul>

    <!-- Description list -->
    <h3>Subject Details</h3>
    <dl>
        <dt>HTML</dt>
        <dd>Creates web pages</dd>

        <dt>CSS</dt>
        <dd>Styles web pages</dd>

        <dt>JavaScript</dt>
        <dd>Adds interactivity to web pages</dd>
    </dl>
</body>
</html>
