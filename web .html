<!DOCTYPE html>
<html>
<head>
  <title>Dashboard Grid Example</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background-color: #f4f4f4;
    }

    /* Grid Layout */
    .container {
      display: grid;

      grid-template-columns: 220px 1fr;

      height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      background-color: #333;
      color: white;
      padding: 20px;
    }

    .sidebar h2 {
      text-align: center;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
    }

    .sidebar li {
      padding: 15px;
      border-bottom: 1px solid gray;
    }

    /* Main Content */
    .main {
      padding: 20px;
    }

    /* Cards Grid */
    .cards {
      display: grid;

      grid-template-columns: repeat(3, 1fr);

      gap: 20px;
      margin-top: 20px;
    }

    .card {
      background-color: white;
      padding: 30px;
      text-align: center;
      border-radius: 10px;
      box-shadow: 0px 2px 5px gray;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- Sidebar -->
    <div class="sidebar">
      <h2>Dashboard</h2>

      <ul>
        <li>Home</li>
        <li>Users</li>
        <li>Reports</li>
        <li>Settings</li>
      </ul>
    </div>

    <!-- Main Content -->
    <div class="main">

      <h1>Welcome Admin</h1>

      <div class="cards">

        <div class="card">
          <h2>150</h2>
          <p>Total Users</p>
        </div>

        <div class="card">
          <h2>85</h2>
          <p>Orders</p>
        </div>

        <div class="card">
          <h2>25</h2>
          <p>Products</p>
        </div>

      </div>

    </div>

  </div>

</body>
</html>
