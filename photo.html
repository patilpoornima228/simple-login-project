<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Photo Gallery</title>
    <style>
        body{
            font-family: Arial;
            background-color: bisque;
            margin: 0;
            padding: 20px;
        }
        h1{
            text-align: center;
        }

        /* Grid container */
        .gallery{
            display: grid;

            /* 3 columns */
            grid-template-columns: repeat(3,1fr);
            gap:20px;
        }

        /* Grid Items */
        .photo{
            background-color: rgb(202, 198, 248);
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0px 2px 5px rgb(10, 9, 9);
        }
        .photo img{
            width: 100%;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <h1>Photo Gallery</h1>

    
    <div class="gallery">
      
        <div class="photo">
          <img src="https://images.pexels.com/photos/236047/pexels-photo-236047.jpeg?cs=srgb&dl=clouds-cloudy-countryside-236047.jpg&fm=jpg">
          <h3>Nature</h3>
        </div>
      
        <div class="photo">
          <img src="https://images.pexels.com/photos/618833/pexels-photo-618833.jpeg?cs=srgb&dl=cold-snow-dawn-618833.jpg&fm=jpg">
          <h3>Mountains</h3>
    </div>
      
        <div class="photo">
          <img src="https://th.bing.com/th/id/R.9e725e8a064cc5741d4f5fe1fe7bac8d?rik=1ofXDgCcAD040w&riu=http%3a%2f%2fwallpapercave.com%2fwp%2fnVVIGAp.jpg&ehk=tCR5fINtTvz8Tx5owsgeuxvC7YYiMqUvbhfSbMob2OQ%3d&risl=&pid=ImgRaw&r=0">
          <h3>Beach</h3>
    </div>
      
        <div class="photo">
          <img src="https://wallpaperaccess.com/full/773426.jpg">
          <h3>Forest</h3>
    </div>
      
        <div class="photo">
          <img src="https://digital-photography-school.com/wp-content/uploads/flickr/13156101845_96c63a9e27_o-600x316.jpg">
          <h3>City</h3>
    </div>
      
        <div class="photo">
          <img src="https://th.bing.com/th/id/OIP.z8CnQLlS0bMu75NwTCmh1QHaEo?r=0&o=7rm=3&rs=1&pid=ImgDetMain&o=7&rm=3">
          <h3>Flowers</h3>
          </div>

    </div>


</body>
</html>
