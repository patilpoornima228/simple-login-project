<!DOCTYPE html>
<html lang="en">
<head>
    <title>stylishs Links Example</title>
    <style>
        body{
            font-family: Arial;
            background-color: rgb(154, 163, 172);
            text-align: center;
            padding-top:80px;
        }

        h1{
            color: antiquewhite;
            text-align: center;
        }

        .links {
            display:flex;
            justify-content: center;
             flex-wrap: wrap;
             gap:20px;
         }
         .links a{
            text-decoration: none;
            background-color: aqua;
            color: rgb(150, 150, 167);

            padding: 18px 35px;
            border-radius: 50px;

            font-size: 20px;
            font-weight: bold;

            transition: 0.4s;
            box-shadow: 0px 4px 10px gray;
         }

         .links a:hover{
            transform: translateY(-8px);
            background: linear-gradient(to right, rgb(21, 117, 97));
         }
         
        </style>
</head>
<body>
    <h1>Quick Links</h1>

    <div> class="links">

        <a href="">You Tube</a>


         <a href="">instagram</a>


          <a href="">Facebook</a>


           <a href="">Whatsapp</a>


            <a href="">Linkedin</a>


             <a href="">GitHub</a>

          </div>
    
</body>
</html>
